<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課題の確認</title>
<style>

/* ===== 基本（白・シンプル） ===== */
:root{--t:#111;--s:#6e6e73;--m:#a1a1a6;--l:#d2d2d7;--l2:#e8e8ed;--bg:#fff;--soft:#f5f5f7;--hd:#595959;--ok:#1a7f37;--ng:#d70015;--acc:#0071e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--t);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select,input{font-family:inherit}
.ico{display:inline-flex;flex:none;line-height:0}.ico svg{width:100%;height:100%}
#pg{position:relative;width:1440px;height:825px;overflow:hidden;background:#fff}
#hdr{height:58px;display:flex;align-items:flex-end;padding:0 28px 10px;position:relative}
#hdr h1{margin:0;font-size:20px;font-weight:700;padding-left:12px;border-left:5px solid var(--t);line-height:1.15;letter-spacing:.02em}
#hdr::after{content:"";position:absolute;left:28px;right:28px;bottom:0;height:1.5px;background:var(--t)}
#app{position:relative;height:767px;overflow:hidden}
/* 選択肢パネル */
.choices{position:absolute;top:18px;bottom:18px;display:flex;flex-direction:column;gap:14px;padding:4px 22px}
.choices.r{right:0;width:300px;border-left:1.5px solid var(--t)}
.choices.l{left:0;width:250px;border-right:1.5px solid var(--t)}
.choices.b{left:28px;right:28px;bottom:14px;top:auto;height:150px;border-top:1.5px solid var(--t);padding:14px 0 0;flex-direction:row;align-items:flex-start;flex-wrap:wrap}
.choices .pool{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.ctag{align-self:flex-start;background:#7f7f7f;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:3px 12px;letter-spacing:.05em}
.cbtn{margin-top:auto;align-self:flex-end;background:var(--t);color:#fff;border:none;border-radius:22px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:transform .15s,opacity .2s}
.cbtn:hover{transform:translateY(-1px)}.cbtn:disabled{opacity:.35;cursor:default;transform:none}
.cbtn.next{animation:nb 1.6s infinite}
@keyframes nb{50%{box-shadow:0 0 0 8px rgba(0,0,0,.08)}}
.choices.b .cbtn{position:absolute;right:0;bottom:4px}
/* ピース・スロット */
.piece{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--t);border-radius:7px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:grab;line-height:1.3;touch-action:none;position:relative;transition:opacity .2s,transform .15s,box-shadow .15s}
.piece:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.piece .ic,.piece .ico{flex:none}
.piece.used{opacity:.22;pointer-events:none}
.piece.sel{box-shadow:0 0 0 3px var(--acc)}
.piece.ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.piece.tile{flex-direction:column;justify-content:center;gap:5px;width:76px;height:76px;padding:6px 4px;border-radius:13px;font-size:9.5px;text-align:center;font-weight:600}
.piece.tile .ico{width:34px;height:34px}
.piece.row{width:100%}
.slot{min-height:38px;min-width:110px;border:1.5px dashed #8e8e93;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:background .15s,border-color .15s}
.slot.sq{width:80px;height:80px;min-width:0;border-radius:13px}
.slot.sq.filled>.piece{width:76px;height:76px}
.slot.hov,.slot.selectable{background:#f0f6ff;border-color:var(--acc)}
.slot.filled{border-color:transparent;background:transparent}
.slot.filled>.piece{width:100%}
.slot .ph{font-size:11px;color:var(--m);pointer-events:none}
.slot.bin{flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:8px;padding:10px;border-color:#8e8e93!important;background:#fff!important;border-style:dashed!important}
.slot.bin>.piece{width:auto}
.slot.ok>.piece{border-color:var(--ok)}
.slot[data-off]{opacity:.35;pointer-events:none}
.err-glow{animation:eg 1s ease-in-out 3;border-color:var(--ng)!important;border-style:solid!important;box-shadow:0 0 0 3px rgba(215,0,21,.15),0 0 16px rgba(215,0,21,.45)!important}
@keyframes eg{50%{box-shadow:0 0 0 5px rgba(215,0,21,.25),0 0 26px rgba(215,0,21,.7)}}
.lit{box-shadow:0 0 0 3px var(--t)!important}
/* エンジニアくん：エラーのそばに */
.engpop{position:absolute;z-index:60;display:flex;gap:8px;align-items:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.engpop .av{width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--t);display:flex;align-items:center;justify-content:center;flex:none}
.engpop .av .ico{width:30px;height:30px}
.engpop .bb{background:#fff;border:1.5px solid var(--t);border-radius:16px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.engpop.ng .bb{border-color:var(--ng);color:var(--ng)}.engpop.ng .av{border-color:var(--ng)}
.engpop.ok .bb{border-color:var(--ok);color:var(--ok)}
.engpop.flip{flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
/* 汎用 */
.tag{display:inline-block;background:#7f7f7f;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:3px 12px}
.lane{border:1.5px solid var(--t);border-radius:4px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.lane>.lh{background:var(--hd);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;height:46px}
.lane>.lh .ico{color:#fff}
.tri{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:13px solid #8e8e93;margin:6px auto}
.tri.r{border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:13px solid #8e8e93;border-right:0;margin:0 6px}
.bigtri{width:0;height:0;border-top:60px solid transparent;border-bottom:60px solid transparent;border-left:44px solid var(--l2)}
.arrow-h{height:3px;background:#8e8e93;position:relative}
.arrow-h::after{content:"";position:absolute;right:-2px;top:-6px;border:7.5px solid transparent;border-left:11px solid #8e8e93}
.arrow-h.l::after{right:auto;left:-2px;border-left:7.5px solid transparent;border-right:11px solid #8e8e93}
.box{border:1.5px solid var(--t);border-radius:12px;background:#fff}
.dbox{border:1.5px dashed #8e8e93;border-radius:12px}
.toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:var(--t);color:#fff;padding:9px 20px;border-radius:22px;font-weight:700;font-size:13px;z-index:80;animation:pop .25s}
.wires{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:visible}
.wires path{fill:none;stroke:var(--t);stroke-width:1.5}
.wires path.dash{stroke-dasharray:5 5}
.wires path.fade{stroke:var(--l)}
.dot{position:absolute;z-index:40;transform:translate(-50%,-50%);background:var(--t);color:#fff;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;pointer-events:none}
.dot.c{width:12px;height:12px;padding:0;border-radius:50%}
.zone{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.zl{font-size:12px;font-weight:700;color:var(--s);display:flex;align-items:center;gap:6px}
.slot.bin>.piece.tile{width:76px}


/* ===== このページ ===== */

/* オープニング */
#mv{position:absolute;inset:0;z-index:95;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
#mv .stage{position:relative;width:1000px;height:420px}
#mv .it{position:absolute;transform:translate(-50%,-50%);transition:all .6s cubic-bezier(.3,1.3,.5,1);opacity:0}
#mv .it.on{opacity:1}
#mv .cap{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:30px;font-weight:700;letter-spacing:.06em;transition:opacity .3s}
#mv .ln{position:absolute;height:0;border-top:2.5px dashed #111;transition:width .7s ease;width:0}
#mv .ttl{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;transition:opacity .5s}
#mv .ttl h2{margin:0;font-size:52px;letter-spacing:.06em}
#mv .chv{display:flex;gap:6px}
#mv .chv span{padding:12px 28px 12px 34px;font-size:16px;font-weight:700;background:#e8e8ed;color:#a1a1a6;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,12% 50%);transition:all .25s}
#mv .chv span.on{background:#111;color:#fff}
#mv .skip{position:absolute;right:28px;bottom:24px;background:#fff;border:1.5px solid #111;border-radius:20px;padding:7px 18px;font-weight:700;cursor:pointer;z-index:3;font-size:12px}
/* 本編 */
.wrap{position:absolute;left:28px;right:330px;top:22px;bottom:20px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.chev{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cv{position:relative;height:80px;display:flex;align-items:center;justify-content:center}
.cv::before{content:"";position:absolute;inset:0;background:#f5f5f7;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,10% 50%)}
.cv .slot{position:relative;width:118px;min-width:0;height:40px}
.cv .slot .piece{justify-content:center;font-size:14px;font-weight:700}
.cv.lit::before{background:#111}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;min-height:430px}
.mc{display:flex;flex-direction:column;gap:8px}
.mt{border:1.5px solid var(--t);border-radius:8px;padding:10px 10px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;background:#fff;transition:background .3s,color .3s}
.mt .ico{width:18px;height:18px}
.mc.lit .mt{background:#111;color:#fff}

</style>
</head>
<body>
<div id="pg"><main id="app">
<div id="mv"><div class="stage" id="st"></div><div class="cap" id="cap"></div>
  <div class="ttl" id="ttl"><h2>ECサイトをつくろう</h2><div class="chv" id="chv"></div></div><button class="skip" id="skip">スキップ</button></div>
<div class="wrap"><div class="chev" id="chev"></div><div class="map" id="map"></div></div>
<div class="choices r"><span class="ctag">選択肢</span><div class="pool" id="pool" style="flex-direction:column;gap:10px"></div></div>
</main></div>

const ic=(k,s=24,c)=>`<i class="ico" style="width:${s}px;height:${s}px;${c?"color:"+c:""}">${ICON[k]||""}</i>`;

/* ===== 基本の部品 ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const yen=n=>(Number(n)<0?'−￥':'￥')+Math.abs(Number(n)).toLocaleString();

/* 進捗（目次と共有） */
const Progress={KEY:'ec-dev-progress',LOCK:'ec-dev-lock',
  get(){try{return JSON.parse(localStorage.getItem(this.KEY))||{}}catch(e){return{}}},
  set(id){try{const p=this.get();p[id]=true;localStorage.setItem(this.KEY,JSON.stringify(p))}catch(e){}},
  locked(){try{return localStorage.getItem(this.LOCK)==='1'}catch(e){return false}}};
function postParent(m){try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}}

/* #pg 内の座標 */
function relRect(el){const pr=$('#pg').getBoundingClientRect(),k=pr.width/1440,r=el.getBoundingClientRect();
  return{x:(r.left-pr.left)/k,y:(r.top-pr.top)/k,w:r.width/k,h:r.height/k,cx:(r.left+r.width/2-pr.left)/k,cy:(r.top+r.height/2-pr.top)/k,r:(r.right-pr.left)/k,b:(r.bottom-pr.top)/k}}

/* ページ：タイトルと「答え合わせ」ボタン */
const Page={cfg:null,state:'check',
  init(cfg){this.cfg=cfg;$('#pg').insertBefore(h(`<header id="hdr"><h1>${cfg.title}</h1></header>`),$('#app'));
    const host=$('.choices')||$('#pg');const b=h(`<button class="cbtn" id="checkBtn">${cfg.checkLabel||'答え合わせをする'}</button>`);
    if(host.id==='pg'){b.style.cssText='position:absolute;right:28px;bottom:22px;z-index:30'}host.appendChild(b);
    b.onclick=()=>this._click();postParent({type:'page-ready',id:cfg.id});
    if(cfg.guide)setTimeout(()=>{const g=cfg.guide();if(g)Eng.guide(g[0],g[1])},600)},
  setLabel(t){$('#checkBtn').textContent=t},busy(b){$('#checkBtn').disabled=b},
  async _click(){if(this.state==='next'){postParent({type:'next',id:this.cfg.id});return}
    if(this._run)return;this._run=true;this.busy(true);Eng.clear();let r=false;
    try{r=await this.cfg.onCheck()}catch(e){console.error(e)}this._run=false;this.busy(false);if(r===true)this.complete()},
  complete(){if(this.state==='next')return;this.state='next';Progress.set(this.cfg.id);postParent({type:'exercise-complete',id:this.cfg.id});
    const b=$('#checkBtn');b.classList.add('next');this.setLabel(this.cfg.nextLabel||'次へ進む');if(this.cfg.done)toast(this.cfg.done)}};

/* エンジニアくん：該当箇所のそばに、一言で */
const Eng={
  clear(){$$('.engpop').forEach(e=>e.remove());$$('.err-glow').forEach(e=>e.classList.remove('err-glow'))},
  point(el,text,{type='ng',keep=false,glow=true,avoid,below=false}={}){if(!keep)this.clear();if(!el)return;if(glow&&type==='ng')el.classList.add('err-glow');
    const p=h(`<div class="engpop ${type}"><div class="av">${ic('engineer',30)}</div><div class="bb">${text}</div></div>`);$('#pg').appendChild(p);
    const av=[el,avoid||el.closest('[data-avoid]')].filter(Boolean).map(relRect);
    const R=av.reduce((a,b)=>({x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),r:Math.max(a.r,b.r),b:Math.max(a.b,b.b)}));R.cx=(R.x+R.r)/2;R.cy=relRect(el).cy;
    const pw=p.offsetWidth,ph=p.offsetHeight;let cand=[[R.r+10,R.cy-ph/2,0],[R.x-pw-10,R.cy-ph/2,1],[R.cx-pw/2,R.b+8,0],[R.cx-pw/2,R.y-ph-8,0]];if(below)cand=[cand[2],...cand];
    const blk=$$('.no-cover').map(relRect),hit=(x,y)=>blk.some(b=>x<b.r&&x+pw>b.x&&y<b.b&&y+ph>b.y);
    const best=cand.find(([x,y])=>x>=6&&x+pw<=1434&&y>=60&&y+ph<=820&&!hit(x,y))||cand.find(([x,y])=>x>=6&&x+pw<=1434&&y>=60&&y+ph<=820)||cand[2];
    p.style.left=Math.max(6,Math.min(1434-pw,best[0]))+'px';p.style.top=Math.max(60,Math.min(820-ph,best[1]))+'px';if(best[2])p.classList.add('flip');return p},
  guide(el,text,o={}){return this.point(el,text,Object.assign({type:'info'},o))},
  errors(list){this.clear();list.forEach(e=>e.el&&e.el.classList.add('err-glow'));if(list[0])this.point(list[0].el,list[0].msg,{keep:true})}};

document.addEventListener('pointerdown',e=>{if(!e.target.closest('.engpop'))$$('.engpop.info').forEach(x=>x.remove())},true);
function toast(t){const e=h(`<div class="toast">${t}</div>`);$('#pg').appendChild(e);setTimeout(()=>e.remove(),1800)}

/* 線とデータの流れ */
const Wire={
  svg(){let s=$('#pg>.wires');if(!s){s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','wires');$('#pg').appendChild(s)}return s},
  line(a,b,{cls='',side,curve=true,ax,bx,vert=false}={}){const A=relRect(a),B=relRect(b);const lr=A.cx<B.cx;
    if(vert){const p=document.createElementNS('http://www.w3.org/2000/svg','path');const x1=A.cx,y1=A.b,x2=B.cx,y2=B.y,my=(y1+y2)/2;p.setAttribute('d',`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);if(cls)p.setAttribute('class',cls);this.svg().appendChild(p);return p}
    const x1=ax??(lr?A.r:A.x),y1=A.cy,x2=bx??(lr?B.x:B.r),y2=B.cy;const mx=(x1+x2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',curve?`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`);if(cls)p.setAttribute('class',cls);this.svg().appendChild(p);return p},
  clear(){const s=$('#pg>.wires');if(s)s.innerHTML=''},
  async send(a,b,label='',{dur=800,cls=''}={}){const A=relRect(a),B=relRect(b);const d=h(`<div class="dot ${label?'':'c'} ${cls}">${label}</div>`);$('#pg').appendChild(d);
    d.style.left=A.cx+'px';d.style.top=A.cy+'px';d.style.transition=`left ${dur}ms ease-in-out,top ${dur}ms ease-in-out`;await sleep(30);d.style.left=B.cx+'px';d.style.top=B.cy+'px';await sleep(dur+30);d.remove()}};

/* 画面サイズに合わせる */
(function(){const fit=()=>{const pg=$('#pg');if(!pg)return;const s=Math.min(innerWidth/1440,innerHeight/825);pg.style.transformOrigin='0 0';pg.style.transform=Math.abs(s-1)<.002?'':`scale(${s})`};addEventListener('resize',fit);fit()})();

/* ---------- パズル（ドラッグ＆ドロップ / クリック選択） ---------- */
class Puzzle{
  constructor({pieces,pool,order,root,onChange,pieceCls='',shuffle:sh=true,swap=false,tile=false}){
    this.tile=tile;
    this.swap=swap;this.selSlot=null;this.defs=pieces;this.pool=pool;this.root=root||$('#app');this.onChange=onChange||(()=>{});this.pieceCls=pieceCls;
    this.order=order||Object.keys(pieces);if(sh)this.order=shuffle(this.order);
    this.map=new Map();this.sel=null;this.locked=false;
    $$('.slot',this.root).forEach(s=>{if(!s.dataset.ph0)s.dataset.ph0=s.innerHTML});
    this.renderPool();this._bind();
  }
  slots(){return $$('.slot',this.root).filter(s=>!s.closest('[data-off]'))}
  mk(id,extra=''){const d=this.defs[id];const t=d.tile??this.tile;const icon=d.icon?(ICON[d.icon]?ic(d.icon,t?34:18):`<span class="ic">${d.icon}</span>`):'';return h(`<div class="piece ${t?'tile':''} ${this.pieceCls} ${d.cls||''} ${extra}" data-pid="${id}">${icon}<span class="lb">${d.label}</span></div>`)}
  renderPool(){if(!this.pool)return;this.pool.innerHTML='';const used=new Set([].concat(...this.map.values()));
    this.order.forEach(id=>{const p=this.mk(id);if(used.has(id)&&!this.defs[id].inf)p.classList.add('used');if(this.sel===id)p.classList.add('sel');this.pool.appendChild(p)})}
  renderSlot(s){const ids=this.map.get(s)||[];s.classList.remove('ok');
    if(!ids.length){s.innerHTML=s.dataset.ph0||'';s.classList.remove('filled');return}
    s.innerHTML='';ids.forEach(id=>{const p=this.mk(id);p.dataset.from='1';s.appendChild(p)});s.classList.add('filled')}
  get(s){return (this.map.get(s)||[])[0]}
  getAll(s){return this.map.get(s)||[]}
  put(s,id,{silent}={}){
    if(!this.defs[id].inf)for(const [k,v] of this.map){if(v.includes(id)){this.map.set(k,v.filter(x=>x!==id));this.renderSlot(k)}}
    const bin=s.classList.contains('bin');const cur=this.map.get(s)||[];
    this.map.set(s,bin?[...cur.filter(x=>x!==id),id]:[id]);this.renderSlot(s);
    s.classList.remove('err-glow');this.sel=null;this.renderPool();if(!silent)this.onChange(s,id);
  }
  swapSlots(a,b){const x=this.map.get(a)||[],y=this.map.get(b)||[];this.map.set(a,y);this.map.set(b,x);this.renderSlot(a);this.renderSlot(b);$$('.slot',this.root).forEach(z=>z.classList.remove('selectable','err-glow'));this.onChange(b,x[0])}
  remove(s,id){const v=(this.map.get(s)||[]).filter(x=>x!==id);this.map.set(s,v);this.renderSlot(s);this.renderPool();this.onChange(s,null)}
  reset(){this.map.clear();this.slots().forEach(s=>this.renderSlot(s));this.renderPool()}
  check(){const empty=[],wrong=[];
    this.slots().forEach(s=>{const acc=(s.dataset.accept||'').split('|');const ids=this.map.get(s)||[];
      if(s.classList.contains('bin')){if(ids.some(i=>!acc.includes(i)))wrong.push(s);else if(acc.some(a=>!ids.includes(a)))empty.push(s)}
      else if(!ids.length)empty.push(s);else if(!acc.includes(ids[0]))wrong.push(s)});
    return {ok:!empty.length&&!wrong.length,empty,wrong}}
  /* 標準の答え合わせ：エンジニアくんが指摘 */
  judge(){const r=this.check();
    if(r.ok){this.slots().forEach(s=>s.classList.add('ok'));return true}
    const list=[...r.wrong.map(s=>({el:s,msg:s.dataset.hint||'ここをもう一度'})),...r.empty.map(s=>({el:s,msg:s.classList.contains('bin')?'まだ足りないよ':'まだ空いているよ'}))];
    Eng.errors(list);return false}
  lock(b=true){this.locked=b}
  _bind(){
    let st=null;
    const down=e=>{if(this.locked)return;const p=e.target.closest('.piece');if(!p||!p.dataset.pid||!(this.root.contains(p)||(this.pool&&this.pool.contains(p))))return;
      if(p.classList.contains('used'))return;e.preventDefault();
      st={p,id:p.dataset.pid,from:p.dataset.from?p.closest('.slot'):null,x:e.clientX,y:e.clientY,g:null}};
    const move=e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(!st.g&&Math.hypot(dx,dy)>5){const r=st.p.getBoundingClientRect();st.g=st.p.cloneNode(true);st.g.classList.add('ghost');st.g.classList.remove('sel');st.g.style.width=r.width+'px';st.ox=e.clientX-r.left;st.oy=e.clientY-r.top;document.body.appendChild(st.g);st.p.style.opacity=.35}
      if(st.g){st.g.style.left=(e.clientX-st.ox)+'px';st.g.style.top=(e.clientY-st.oy)+'px';$$('.slot.hov').forEach(s=>s.classList.remove('hov'));const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest('.slot');if(s&&this.root.contains(s))s.classList.add('hov')}};
    const up=e=>{if(!st)return;const s0=st;st=null;$$('.slot.hov').forEach(s=>s.classList.remove('hov'));
      if(s0.g){s0.g.remove();s0.p.style.opacity='';const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest('.slot');
        if(s&&this.swap&&s0.from&&s!==s0.from){this.swapSlots(s0.from,s);return}
        if(s&&this.root.contains(s)&&!s.closest('[data-off]')){if(s0.from&&s0.from!==s&&this.defs[s0.id].inf){this.map.set(s0.from,(this.map.get(s0.from)||[]).filter(x=>x!==s0.id));this.renderSlot(s0.from)}this.put(s,s0.id)}
        else if(s0.from){this.remove(s0.from,s0.id)}
        return}
      /* クリック */
      if(s0.from&&this.swap){if(this.selSlot&&this.selSlot!==s0.from){const a=this.selSlot;this.selSlot=null;this.swapSlots(a,s0.from)}else{this.selSlot=this.selSlot===s0.from?null:s0.from;$$('.slot',this.root).forEach(x=>x.classList.toggle('selectable',x===this.selSlot))}return}
      if(s0.from){if(this.sel&&this.sel!==s0.id){this.put(s0.from,this.sel)}else this.remove(s0.from,s0.id);return}
      this.sel=this.sel===s0.id?null:s0.id;this.renderPool();this._mark()};
    document.addEventListener('pointerdown',down);document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    this.root.addEventListener('click',e=>{if(this.locked||!this.sel)return;if(e.target.closest('.piece'))return;const s=e.target.closest('.slot');if(s&&!s.closest('[data-off]')){this.put(s,this.sel);this._mark()}});
  }
  _mark(){$$('.slot',this.root).forEach(s=>s.classList.toggle('selectable',!!this.sel&&!s.classList.contains('filled')))}
}


</script>
