<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC-SHOP</title>
<style>
:root{--line:#e5e5ea;--sub:#6e6e73;--t:#111}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased;user-select:none}
.ico{display:inline-flex;line-height:0;flex:none}.ico svg{width:100%;height:100%}
#win{width:1440px;height:825px;display:grid;grid-template-rows:42px 1fr 26px;transform-origin:0 0;background:#fff}
#tb{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block;background:#d2d2d7}
#scheme{margin:0 auto;display:flex;align-items:center;gap:8px;background:#f5f5f7;border-radius:8px;padding:5px 16px;font-size:12px;min-width:420px;justify-content:center}
#scheme b{font-weight:700}
#prog{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
#prog .bar{width:110px;height:4px;border-radius:2px;background:#e5e5ea;overflow:hidden}#prog .bar i{display:block;height:100%;background:#111;transition:width .5s}
#body{display:grid;grid-template-columns:48px 262px 1fr;min-height:0}
#act{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px}
#act .a{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#a1a1a6}
#act .a.on{color:#111;background:#f5f5f7}
#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .sh{height:36px;display:flex;align-items:center;padding:0 16px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
#side .proj{display:flex;align-items:center;gap:6px;padding:2px 12px 8px 14px;font-size:12px;font-weight:700}
#tree{flex:1;overflow-y:auto;padding:0 8px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:7px;height:28px;border-radius:6px;padding-right:8px;cursor:pointer;white-space:nowrap}
.row:hover{background:#f5f5f7}
.row .tw{width:12px;color:#a1a1a6;font-size:8px;text-align:center;transition:transform .15s;flex:none}
.row.open>.tw{transform:rotate(90deg)}
.row .ic{width:16px;height:16px;display:flex;color:#3a3a3c}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .nm .ext{color:#a1a1a6}
.row.file.act{background:#111;color:#fff}.row.file.act .ic,.row.file.act .st{color:#fff}.row.file.act .ext{color:#a1a1a6}
.row.lock{opacity:.32;cursor:not-allowed}.row.lock:hover{background:none}
.row .st{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#111}
.row.flash{animation:flash 1s 2}@keyframes flash{50%{background:#e5e5ea}}
.row.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.kids.closed{display:none}
.fcount{font-size:10px;color:#a1a1a6;font-weight:600}
#side .foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
#lockBtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#111;text-align:left}
#lockBtn .sw{margin-left:auto;width:34px;height:20px;border-radius:10px;background:#e5e5ea;position:relative;transition:background .2s;flex:none}
#lockBtn .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#lockBtn.on .sw{background:#111}#lockBtn.on .sw::after{left:16px}
#lockBtn small{display:block;font-weight:500;color:var(--sub);font-size:10px;margin-top:1px}
#resetBtn{border:none;background:none;color:#a1a1a6;font-size:11px;cursor:pointer;text-align:left;padding:0 2px}
#ed{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{height:36px;display:flex;border-bottom:1px solid var(--line);overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;padding:0 10px 0 14px;font-size:12px;border-right:1px solid var(--line);cursor:pointer;color:#6e6e73;max-width:220px;white-space:nowrap;position:relative}
.tab .ic{width:14px;height:14px;display:flex}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{color:#111;font-weight:700}.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#111}
.tab .x{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#a1a1a6;font-size:10px}
.tab .x:hover{background:#f5f5f7;color:#111}
#crumb{height:30px;display:flex;align-items:center;gap:6px;padding:0 16px;font-size:12px;color:var(--sub)}
#crumb b{color:#111}#crumb .sep{color:#d2d2d7}
#crumb .r{margin-left:auto}
.pillst{font-size:11px;font-weight:700;border-radius:10px;padding:2px 10px;background:#f5f5f7;color:#6e6e73;display:flex;gap:4px;align-items:center}
.pillst.done{background:#111;color:#fff}
#canvas{flex:1;position:relative;background:#f5f5f7;min-height:0;overflow:hidden}
#frameBox{position:absolute;background:#fff;box-shadow:0 0 0 1px #e5e5ea,0 8px 24px rgba(0,0,0,.06);border-radius:10px;overflow:hidden}
#frameBox iframe{width:1440px;height:825px;border:none;transform-origin:0 0;display:block}
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6e6e73}
#welcome h2{margin:0;color:#111;font-size:26px}
#loader{position:absolute;inset:0;display:none;background:#fff;z-index:3}
#sb{display:flex;align-items:center;gap:18px;padding:0 14px;font-size:11.5px;color:#6e6e73;border-top:1px solid var(--line)}
#sb .r{margin-left:auto;display:flex;gap:16px}
#sbMsg{color:#111;font-weight:700}
</style>
</head>
<body>
<div id="win">
  <div id="tb">
    <div class="dots"><i></i><i></i><i></i></div>
    
    <div id="scheme"><span class="ic" id="tbIc"></span><b>EC-SHOP</b><span style="color:#c7c7cc">›</span><span id="schemeFile">ファイルを選択してください</span></div>
    <div id="prog"><span id="progTxt">0 / 0</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
  </div>
  <div id="body">
    <div id="act"><div class="a on" data-i="folder"></div><div class="a" data-i="magnify"></div><div class="a" data-i="route"></div><div class="a" data-i="play"></div><div class="a" data-i="gear"></div></div>
    <aside id="side">
      <div class="sh">エクスプローラー</div>
      <div class="proj"><span>EC-SHOP-PROJECT</span><span style="margin-left:auto" class="fcount" id="cnt"></span></div>
      <div id="tree"></div>
      <div class="foot">
        <button id="lockBtn"><span id="lockIc"></span><span><span id="lockT">自由モード</span><small id="lockS">すべてのファイルを開けます</small></span><span class="sw"></span></button>
        <button id="resetBtn">↺ 進捗をリセット</button>
      </div>
    </aside>
    <section id="ed">
      <div id="tabs"></div>
      <div id="crumb"></div>
      <div id="canvas">
        <div id="welcome"><div id="wIc"></div><h2>ECサイトをつくろう</h2><div>左のエクスプローラーからファイルを開いてください</div></div>
        <div id="frameBox" style="display:none"><iframe id="fr" title="演習"></iframe><div id="loader"></div></div>
      </div>
    </section>
  </div>
  <div id="sb"><span>main</span><span id="sbLock">自由モード</span><span id="sbMsg"></span><div class="r"><span id="sbDone"></span><span>UTF-8</span><span>HTML</span></div></div>
</div>

<script>
/* ===== 目次データ（フォルダ = 工程、ファイル = 演習ページ） ===== */
const TREE=[
 {f:'企画',c:[
   {id:'01',n:'課題の確認',x:'md',file:'01-kadai.html'},
   {id:'02',n:'既存ECサイトのフローを可視化',x:'flow',file:'02-genjo-flow.html'},
   {id:'03',n:'理想の業務フローを可視化',x:'flow',file:'03-risou-flow.html'}]},
 {f:'要件定義',c:[
   {id:'04',n:'ステークホルダーへの聞き取り',x:'chat',file:'04-hearing.html'},
   {id:'05',n:'顧客の分析',x:'csv',file:'05-kokyaku.html'},
   {id:'06',n:'必要な機能の確認',x:'req',file:'06-kino.html'},
   {id:'07',n:'法律の確認',x:'law',file:'07-horitsu.html'},
   {id:'08',n:'個人情報保護の確認',x:'pii',file:'08-kojin-kakunin.html'},
   {id:'09',n:'個人情報保護対応',x:'pii',file:'09-kojin-taio.html'},
   {id:'10',n:'健康への影響調査',x:'md',file:'10-kenko.html'},
   {id:'11',n:'情報セキュリティリスク',x:'sec',file:'11-sec-risk.html'},
   {id:'12',n:'セキュリティ対応',x:'sec',file:'12-sec-taio.html'},
   {id:'13',n:'情報モラルの動向調査',x:'md',file:'13-moral.html'}]},
 {f:'設計',c:[
   {id:'14',n:'画面レイアウト',x:'ui',file:'14-layout.html'},
   {f:'システム配置',c:[
     {id:'15',n:'システム配置',x:'arch',file:'15-haichi.html',hub:true},
     {id:'16',n:'文字のデジタル化',x:'txt',file:'16-moji.html',sub:'15'},
     {id:'17',n:'画像のデジタル化',x:'img',file:'17-gazo.html',sub:'15'},
     {id:'18',n:'コンピュータの動作',x:'sys',file:'18-computer.html',sub:'15'},
     {id:'19',n:'論理回路',x:'circ',file:'19-ronri.html',sub:'15'}]},
   {f:'ネットワーク構成図',c:[
     {id:'20',n:'ネットワーク構成図',x:'net',file:'20-network.html',hub:true},
     {id:'21',n:'TCP/IP',x:'net',file:'21-tcpip.html',sub:'20'},
     {id:'22',n:'パケット交換方式',x:'net',file:'22-packet.html',sub:'20'},
     {id:'23',n:'暗号化',x:'key',file:'23-angou.html',sub:'20'},
     {id:'24',n:'接続の流れ',x:'dns',file:'24-setsuzoku.html',sub:'20'}]},
   {id:'25',n:'データベース設計',x:'db',file:'25-db.html'},
   {id:'26',n:'処理の流れ',x:'flow',file:'26-shori.html'}]},
 {f:'開発',c:[
   {id:'27',n:'バックエンド',x:'js',file:'27-backend.html'},
   {id:'28',n:'フロントエンド',x:'html',file:'28-frontend.html'}]},
 {f:'テスト',c:[{id:'29',n:'結合テスト',x:'test',file:'29-test.html'}]},
 {f:'管理運用',c:[{id:'30',n:'価格設定',x:'dash',file:'30-kakaku.html'}]}
];
const EXT_LABEL={md:'.md',flow:'.flow',chat:'.chat',csv:'.csv',req:'.req',law:'.law',pii:'.pii',sec:'.sec',ui:'.ui',arch:'.arch',txt:'.txt',img:'.png',sys:'.sys',circ:'.circuit',net:'.net',key:'.key',dns:'.dns',db:'.db',js:'.js',html:'.html',test:'.test',dash:'.dash'};

/* ===== アイコン（単色） ===== */
/*ICONS*/
const FICON={'01':'flag','02':'route','03':'route','04':'user','05':'barchart','06':'list','07':'law','08':'badge','09':'badge','10':'heart','11':'alert','12':'shield','13':'thumbs','14':'web','15':'server','16':'textsize','17':'images','18':'cpu','19':'calc','20':'world','21':'send','22':'box','23':'key','24':'magnify','25':'db','26':'transfer','27':'sort','28':'tap','29':'tick','30':'money'};
const I={folder:o=>ic(o?'folderopen':'folder',16,'#3a3a3c')};
function icon(x,id){return ic(FICON[id]||'doc',15)}
const CHECK=ic('check',15,'#111'),LOCK=ic('lock',13,'#8e8e93'),HUBDOT=ic('server',0);
/* ===== 状態 ===== */
const KEY='ec-dev-progress',LKEY='ec-dev-lock',TKEY='ec-dev-tabs';
const FILES={},FOLDERS=[];const DISPLAY=[];
(function walk(list,path,parent){list.forEach(n=>{if(n.f){FOLDERS.push(n);n.path=[...path,n.f];walk(n.c,n.path,n)}else{n.path=path;FILES[n.id]=n;DISPLAY.push(n.id)}})})(TREE,[],null);
const HUBS={};DISPLAY.forEach(id=>{const f=FILES[id];if(f.sub)(HUBS[f.sub]=HUBS[f.sub]||[]).push(id)});
/* 完了の順番：ハブ（システム配置・ネットワーク構成図）は、その中のファイルがすべて終わった後に完了する */
const ORDER=[];DISPLAY.forEach(id=>{const f=FILES[id];if(f.hub)return;ORDER.push(id);if(f.sub&&HUBS[f.sub][HUBS[f.sub].length-1]===id)ORDER.push(f.sub)});
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=p=>{try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}};
let done=load(),locked=false,cur=null,tabs=[];
try{locked=localStorage.getItem(LKEY)==='1';tabs=JSON.parse(localStorage.getItem(TKEY))||[]}catch(e){}
const openFolders=new Set(FOLDERS.map(f=>f.path.join('/')));

function unlocked(id){
  if(!locked||done[id])return true;
  const f=FILES[id];if(f.hub)return unlocked(HUBS[id][0]);
  const i=ORDER.indexOf(id);return ORDER.slice(0,i).every(x=>done[x]);
}

/* ===== ツリー描画 ===== */
function renderTree(){
  const box=document.getElementById('tree');box.innerHTML='';
  (function draw(list,depth,host){list.forEach(n=>{
    if(n.f){const key=n.path.join('/');const op=openFolders.has(key);
      const ids=[];(function g(l){l.forEach(x=>x.f?g(x.c):ids.push(x.id))})(n.c);const dn=ids.filter(i=>done[i]).length;
      const r=el(`<div class="row folder ${op?'open':''}" style="padding-left:${4+depth*14}px"><span class="tw">▶</span><span class="ic">${I.folder(op)}</span><span class="nm">${n.f}</span><span class="fcount">${dn}/${ids.length}</span></div>`);
      r.onclick=()=>{op?openFolders.delete(key):openFolders.add(key);renderTree()};host.appendChild(r);
      const k=el(`<div class="kids ${op?'':'closed'}"></div>`);host.appendChild(k);draw(n.c,depth+1,k);
    }else{const u=unlocked(n.id);
      const r=el(`<div class="row file ${cur===n.id?'act':''} ${u?'':'lock'}" data-id="${n.id}" style="padding-left:${18+depth*14}px" title="${n.n}${EXT_LABEL[n.x]}${u?'':'（前のタスクを完了すると開けます）'}"><span class="ic">${icon(n.x,n.id)}</span><span class="nm">${n.n}<span class="ext">${EXT_LABEL[n.x]}</span></span><span class="st">${done[n.id]?CHECK:u?'':LOCK}</span></div>`);
      r.onclick=()=>open(n.id);host.appendChild(r)}
  })})(TREE,0,box);
  const total=DISPLAY.length,dn=DISPLAY.filter(i=>done[i]).length;
  document.getElementById('progTxt').textContent=`完了 ${dn} / ${total}`;document.getElementById('progBar').style.width=(dn/total*100)+'%';
  document.getElementById('sbDone').textContent=`${dn}/${total} 完了`;document.getElementById('cnt').textContent=`${total} files`;
  renderTabs();renderCrumb();
}
function $$a(q){return [...document.querySelectorAll(q)]}
function el(s){const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild}

function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';
  tabs.forEach(id=>{const f=FILES[id];if(!f)return;const e=el(`<div class="tab ${id===cur?'on':''}"><span class="ic">${icon(f.x,id)}</span><span>${f.n}${EXT_LABEL[f.x]}</span><span class="x">✕</span></div>`);
    e.onclick=ev=>{if(ev.target.classList.contains('x')){tabs=tabs.filter(x=>x!==id);saveTabs();if(id===cur){tabs.length?open(tabs[tabs.length-1]):close()}else renderTabs();ev.stopPropagation();return}open(id)};t.appendChild(e)})}
function saveTabs(){try{localStorage.setItem(TKEY,JSON.stringify(tabs))}catch(e){}}
function renderCrumb(){const c=document.getElementById('crumb');if(!cur){c.innerHTML='<span>EC-SHOP-PROJECT</span>';return}const f=FILES[cur];
  c.innerHTML=`<span>EC-SHOP-PROJECT</span>${f.path.map(p=>`<span class="sep">›</span><span>${p}</span>`).join('')}<span class="sep">›</span><span class="ic" style="width:14px;height:14px;display:flex">${icon(f.x,cur)}</span><b>${f.n}${EXT_LABEL[f.x]}</b><div class="r"><span class="pillst ${done[cur]?'done':''}">${done[cur]?'完了':'未完了'}</span></div>`;
  document.getElementById('schemeFile').textContent=f.n+EXT_LABEL[f.x]}

/* ===== ファイルを開く ===== */
function open(id){const f=FILES[id];if(!f)return;
  if(!unlocked(id)){const r=document.querySelector(`.row[data-id="${id}"]`);if(r){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake')}flash('前のタスクを完了すると開けます',true);return}
  f.path.forEach((p,i)=>openFolders.add(f.path.slice(0,i+1).join('/')));
  cur=id;if(!tabs.includes(id)){tabs.push(id);if(tabs.length>6)tabs.shift();saveTabs()}
  document.getElementById('welcome').style.display='none';document.getElementById('frameBox').style.display='block';
  const ld=document.getElementById('loader');ld.style.display='flex';const fr=document.getElementById('fr');fr.onload=()=>{ld.style.display='none'};fr.src=f.file;
  try{history.replaceState(null,'','#'+id)}catch(e){}
  renderTree();fit();
}
function close(){cur=null;document.getElementById('fr').src='about:blank';document.getElementById('frameBox').style.display='none';document.getElementById('welcome').style.display='flex';renderTree()}
function nextOf(id){const f=FILES[id];if(f.sub)return f.sub;
  const i=DISPLAY.indexOf(id);for(let k=i+1;k<DISPLAY.length;k++){const n=FILES[DISPLAY[k]];if(!n.sub)return n.id}return null}

let flashT;function flash(t,bad){const m=document.getElementById('sbMsg');m.textContent=t;m.style.color=bad?'#d70015':'#111';clearTimeout(flashT);flashT=setTimeout(()=>m.textContent='',4000)}

/* ===== 演習ページ（iframe）からの通知 ===== */
window.addEventListener('message',e=>{const d=e.data;if(!d||!d.type)return;
  const fr=document.getElementById('fr');if(e.source!==fr.contentWindow)return;
  const id=d.id||cur;
  if(d.type==='exercise-complete'){done=load();done[id]=true;save(done);renderTree();
    const r=document.querySelector(`.row[data-id="${id}"]`);if(r)r.classList.add('flash');
    const nx=nextOf(id);flash(`${FILES[id].n} 完了${nx&&locked?' ― 次のファイルが開きました':''}`)}
  if(d.type==='next'){const nx=nextOf(id);if(nx)open(nx);else flash('すべての工程が完了しました')}
  if(d.type==='open'&&d.target){open(d.target)}
});

/* ===== ロック（順番モード） ===== */
function renderLock(){const b=document.getElementById('lockBtn');b.classList.toggle('on',locked);
  document.getElementById('lockIc').innerHTML=ic(locked?'lock':'unlock',18);document.getElementById('lockT').textContent=locked?'順番モード':'自由モード';
  document.getElementById('lockS').textContent=locked?'完了すると次のファイルが開きます':'すべてのファイルを開けます';
  document.getElementById('sbLock').textContent=locked?'順番モード':'自由モード'}
document.getElementById('lockBtn').onclick=()=>{locked=!locked;try{localStorage.setItem(LKEY,locked?'1':'0')}catch(e){}renderLock();renderTree();
  const f=cur&&FILES[cur];if(f&&f.hub)document.getElementById('fr').contentWindow.postMessage({type:'state'},'*')};
document.getElementById('resetBtn').onclick=()=>{if(!confirm('すべての完了状態をリセットしますか？'))return;done={};save(done);renderTree();if(cur)open(cur)};

/* ===== 画面サイズに合わせて拡大縮小 ===== */
function fit(){
  const w=document.getElementById('win');const s=Math.min(innerWidth/1440,innerHeight/825);w.style.transform=`scale(${s})`;
  const cv=document.getElementById('canvas'),fb=document.getElementById('frameBox'),fr=document.getElementById('fr');
  const cw=cv.offsetWidth-24,ch=cv.offsetHeight-24;const k=Math.min(cw/1440,ch/825);
  fb.style.width=1440*k+'px';fb.style.height=825*k+'px';fb.style.left=(cv.offsetWidth-1440*k)/2+'px';fb.style.top=(cv.offsetHeight-825*k)/2+'px';fr.style.transform=`scale(${k})`;
}
addEventListener('resize',fit);
window.addEventListener('storage',()=>{done=load();renderTree()});
$$a('#act .a').forEach(e=>e.innerHTML=ic(e.dataset.i,19));document.getElementById('tbIc').innerHTML=ic('bag',15);document.getElementById('wIc').innerHTML=ic('bag',48);
renderLock();renderTree();fit();
const h0=location.hash.slice(1);if(FILES[h0]&&unlocked(h0))open(h0);else if(tabs.length&&unlocked(tabs[tabs.length-1]))open(tabs[tabs.length-1]);
</script>
</body>
</html>
