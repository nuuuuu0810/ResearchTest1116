<script>
const shopOf=x=>`<div class="shop">${shopTop({cart:[]})}${x}</div>`;
const SNS=b=>`<div style="padding:44px 14px 0"><div style="display:flex;gap:8px;align-items:center;font-weight:700">${ic('store',22)}shopping_official</div><div style="font-size:12px;margin:8px 0">お客さまと記念撮影しました！</div><div data-k="pic" style="height:220px;border-radius:12px;background:#f5f5f7;display:flex;align-items:center;justify-content:center;gap:8px;${b?'filter:blur(7px)':''}">${ic('person',80)}${ic('person',80)}</div><div style="margin-top:10px;font-size:11px;color:#6e6e73">♡ 128　💬 12</div></div>`;
const SC=new Scenes({pieces:{copy:{label:'著作権法',icon:'copyright'},face:{label:'肖像権',icon:'camera'},toku:{label:'特定商取引法',icon:'doc'},kei:{label:'景品表示法',icon:'tag'},x1:{label:'道路交通法',icon:'truck'},x2:{label:'個人情報保護法',icon:'badge'}},
 list:[
  {short:'他人が撮った写真を勝手に使う',icon:'images',accept:['copy'],hint:'作品を守る法律は？',target:'img',
   async scene(m){await m.go('detail',{sel:'grape',qty:1});m.el('img').insertAdjacentHTML('beforeend','<span style="position:absolute;font-size:10px;color:#6e6e73;margin-top:150px">© Photo Studio</span>')},
   async fix(m){await m.go('detail',{sel:'grape'});m.badge('自分で撮った写真に',{cls:'ok',icon:'camera',top:300});await sleep(900)}},
  {short:'お客さんの顔をSNSに勝手に投稿',icon:'camera',accept:['face'],hint:'顔や姿を守る権利',target:'pic',
   async scene(m){await m.go('custom',{html:SNS(false)},{label:'SNS'})},async fix(m){await m.go('custom',{html:SNS(true)},{label:'SNS'});m.badge('許可をとって、顔をぼかす',{cls:'ok',icon:'check',top:330});await sleep(900)}},
  {short:'お店の住所や返品の決まりがない',icon:'doc',accept:['toku'],hint:'通信販売のルール',target:'foot',
   async scene(m){await m.go('custom',{html:shopOf(`<div class="err-scr" data-k="foot">${ic('question',44)}<b>連絡先・返品の決まりが<br>見つからない</b></div>`)},{label:'サイトの下'})},
   async fix(m){await m.go('custom',{html:shopOf(`<div class="form"><h3>特定商取引法に基づく表記</h3><div class="card2">販売業者：株式会社Shopping<br>所在地：東京都港区南青山1-2-3<br>電話：03-1234-5678<br>返品：到着後7日以内</div></div>`)},{label:'表記'});await sleep(900)}},
  {short:'根拠のない「日本一」の広告',icon:'megaphone',accept:['kei'],hint:'うその表示を禁止',target:'banner',
   async scene(m){await m.go('top');m.el('banner').innerHTML=`<div><b>日本一あまい！</b><small>通常 <s>￥3,000</s> → ￥500</small></div>${ic('grape',56)}`},
   async fix(m){await m.go('top');m.el('banner').innerHTML=`<div><b>旬のぶどう</b><small>1房 ￥500</small></div>${ic('grape',56)}`;await sleep(900)}}]});
Page.init({id:'07',title:'法律の確認',done:'法律でリスクを防げた！',onCheck:()=>SC.check()});SC.start();
</script>
