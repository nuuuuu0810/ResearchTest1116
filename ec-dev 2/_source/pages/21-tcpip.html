<!-- title: TCP/IP -->
<!-- use: puzzle,linerisk -->
<style>
.top{position:absolute;left:28px;right:330px;top:16px;height:470px;display:grid;grid-template-columns:1fr 120px 1fr;gap:12px}
.side{display:flex;flex-direction:column;gap:6px}
.side .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;height:40px}
.lay{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;border:1.5px solid var(--l);border-radius:10px;padding:8px 10px;height:86px;transition:all .3s}
.lay .nm{font-size:12px;font-weight:700;line-height:1.35}.lay .nm small{display:block;font-size:10.5px;color:var(--s);font-weight:600}
.lay.on{border-color:var(--t)}
.lay.hl{background:#111;color:#fff}.lay.hl .nm small{color:#c7c7cc}
.pk{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .3s}.lay.on .pk{opacity:1}
.pk span{font-size:9.5px;font-weight:700;padding:5px 6px;border-radius:4px;white-space:nowrap;border:1.5px solid #111}
.pk .d{background:#fff}.pk .a{background:#e5e5ea}.pk .i{background:#a1a1a6;color:#fff}.pk .n{background:#3a3a3c;color:#fff}
.side.r .lay{grid-template-columns:1fr 150px}.side.r .pk{justify-content:flex-start;order:-1}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding-bottom:14px}
.mid .ico{width:40px;height:40px}
.tri{border-top-color:#c7c7cc}
</style>
<div class="top"><div class="side l" id="snd"><div class="hd" id="h1"></div></div><div class="mid" id="md"></div><div class="side r" id="rcv"><div class="hd" id="h2" style="justify-content:flex-end"></div></div></div>
<div class="lr" id="lr"><div class="ln"></div><div class="end" style="left:56px" id="eP"></div><div class="end" style="right:56px" id="eS"></div></div>
<div class="choices r"><span class="ctag">選択肢</span><div class="pool" id="pool"></div></div>
<script>
$('#h1').innerHTML=ic('phone',22)+'送る側（上から順に情報を付ける）';$('#h2').innerHTML='受け取る側（下から順に確認）'+ic('server',22);
$('#md').innerHTML=ic('wifi',40)+ic('world',40);$('#eP').innerHTML=ic('phone',44)+'スマホ';$('#eS').innerHTML=ic('server',44)+'サーバー';
const LY=[{k:'app',n:'アプリケーション層',s:'やってほしいことを指定',r:'指示された処理を行う',pk:[['d','このページを見たい']],risk:'何をしてほしいか伝わらない',ic:'question',h:'やってほしいことを伝える層'},
 {k:'tr',n:'トランスポート層',s:'分けて、届けるアプリを指定',r:'元に戻して、アプリを確認',pk:[['a','アプリ'],['d','データ①']],risk:'どのアプリに、どの順で？',ic:'sort',h:'分けて番号とアプリを付ける'},
 {k:'ip',n:'インターネット層',s:'最終目的地を指定',r:'目的地が自分か確認',pk:[['i','最終目的地'],['a','アプリ'],['d','データ①']],risk:'どのコンピュータに届ける？',ic:'flag',h:'最終目的地の住所'},
 {k:'nw',n:'ネットワーク\nインターフェース層',s:'次の経由地を指定・電気信号に',r:'信号を0と1に戻す',pk:[['n','次の経由地'],['i','最終目的地'],['a','アプリ'],['d','データ①']],risk:'となりのWi-Fiまでどう送る？',ic:'wifi',h:'となりの機器と電気信号'}];
LY.forEach((l,i)=>{const pk=`<div class="pk">${l.pk.map(p=>`<span class="${p[0]}">${p[1]}</span>`).join('')}</div>`;
 $('#snd').insertAdjacentHTML('beforeend',`<div class="lay" data-k="${l.k}"><div class="nm">${l.n.replace('\n','')}<small>${l.s}</small></div>${pk}</div>`+(i<3?'<i class="tri" style="margin:0 auto"></i>':''));
 $('#rcv').insertAdjacentHTML('beforeend',`<div class="lay" data-k="${l.k}"><div class="nm">${l.n.replace('\n','')}<small>${l.r}</small></div>${pk}</div>`+(i<3?'<i class="tri" style="margin:0 auto;transform:rotate(180deg)"></i>':''));
 $('#lr').insertAdjacentHTML('beforeend',`<div class="rk wait" data-avoid="1" style="left:${22+i*19}%" data-i="${i}"><div class="slot sq" data-accept="${l.k}" data-hint="${l.h}" data-off="1"></div><div class="tx">${ic(l.ic,18)}${l.risk}</div></div>`)});
const pieces={};LY.forEach(l=>pieces[l.k]={label:l.n.replace('\n',''),icon:{app:'web',tr:'scissors',ip:'flag',nw:'signal'}[l.k]});pieces.x1={label:'デザイン層',icon:'images'};
const P=new Puzzle({root:$('#lr'),pool:$('#pool'),pieces,tile:true});let i=0;
function show(){$$('.rk').forEach((r,k)=>{r.classList.toggle('cur',k===i);if(k===i){r.classList.remove('wait');$('.slot',r).removeAttribute('data-off')}});Eng.guide($(`.rk[data-i="${i}"] .slot`),'どの層で防ぐ？')}
Page.init({id:'21',title:'TCP/IP',nextLabel:'ネットワーク構成図へ戻る',done:'4つの層がそろった！',
 async onCheck(){if(!P.judge())return false;const r=$(`.rk[data-i="${i}"]`);$('.slot',r).setAttribute('data-off','1');r.classList.remove('cur');r.classList.add('done');
  $$(`.lay[data-k="${LY[i].k}"]`).forEach(e=>e.classList.add('on'));i++;
  if(i<LY.length){show();return false}P.lock();
  for(const l of LY){const e=$(`#snd .lay[data-k="${l.k}"]`);e.classList.add('hl');await sleep(450);e.classList.remove('hl')}
  await Wire.send($('#snd .lay[data-k="nw"]'),$('#md .ico'),'0101…',{dur:600});await Wire.send($('#md .ico'),$('#rcv .lay[data-k="nw"]'),'0101…',{dur:600});
  for(const l of [...LY].reverse()){const e=$(`#rcv .lay[data-k="${l.k}"]`);e.classList.add('hl');await sleep(450);e.classList.remove('hl')}return true}});
show();
</script>
